# Main matrix: strategies x peer sets x (bootstrap + restart after offline durations).
corpus = "graph"
out_dir = "out/matrix"
seed = 1

strategies = [
  "baseline",
  "filter_since_last_seen",
  "range_then_scids",
  { name = "range_then_scids", query_peers = 1 },
  { name = "range_then_scids", use_checksums = false },
]

[run]
duration_s = 7200

[link]
latency_ms = 40
bandwidth_mbps = 20.0

[[peer_sets]]
name = "mixed"
peers = [{ profile = "lnd" }, { profile = "cln" }, { profile = "eclair" }]

# Rough mainnet implementation mix for an 8-peer node.
[[peer_sets]]
name = "mixed8"
peers = [{ profile = "lnd", count = 4 }, { profile = "cln", count = 2 }, { profile = "eclair" }, { profile = "ldk" }]

[[peer_sets]]
name = "3lnd"
peers = [{ profile = "lnd", count = 3 }]

[[peer_sets]]
name = "3cln"
peers = [{ profile = "cln", count = 3 }]

[[peer_sets]]
name = "3eclair"
peers = [{ profile = "eclair", count = 3 }]

[[peer_sets]]
name = "3ldk"
peers = [{ profile = "ldk", count = 3 }]

[[scenarios]]
kind = "bootstrap"

[[scenarios]]
kind = "restart"
offline = ["1h", "6h", "1d", "3d", "7d", "13d", "15d", "21d"]
