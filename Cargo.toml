[workspace]
resolver = "2"
members = ["corpus", "sim"]

[workspace.dependencies]
# LDK fork with the simulator hooks: https://github.com/elnosh/rust-lightning/tree/gossip-sim
# All sim hooks are behind `--cfg sim_clock`, which .cargo/config.toml sets for the whole
# workspace build.
lightning = { git = "https://github.com/elnosh/rust-lightning", branch = "gossip-sim", default-features = false, features = ["std"] }
bitcoin = { version = "0.32", default-features = false, features = ["std", "secp-recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
